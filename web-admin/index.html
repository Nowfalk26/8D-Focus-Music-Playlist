<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flow 8D" />
    <meta name="theme-color" content="#121212" />
    <title>Flow 8D — Spatial Audio Experience & Studio</title>
    
    <!-- Google Fonts: Plus Jakarta Sans, Syne, Inter, JetBrains Mono & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    

    <style>
      /* Base resets */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #07050b;
        color: #f8fafc;
        font-family: "Plus Jakarta Sans", sans-serif;
        overflow-x: hidden;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Ambient background gradient mesh from Stitch */
      .ambient-bg {
        background: radial-gradient(circle at 10% 15%, rgba(123, 44, 191, 0.22) 0%, transparent 45%),
                    radial-gradient(circle at 90% 40%, rgba(0, 240, 255, 0.15) 0%, transparent 48%),
                    radial-gradient(circle at 50% 85%, rgba(157, 78, 221, 0.2) 0%, transparent 55%),
                    #07050b;
      }

      /* Frosted glass utilities */
      .glass-panel {
        background: rgba(26, 19, 41, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(157, 78, 221, 0.25);
      }
      
      .glass-input {
        background: rgba(20, 14, 32, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(157, 78, 221, 0.28);
      }

      /* 3D Orbital Sound Stage Animations */
      @keyframes orbit-cw {
        0% { transform: rotateX(68deg) rotateZ(0deg); }
        100% { transform: rotateX(68deg) rotateZ(360deg); }
      }
      @keyframes orbit-ccw {
        0% { transform: rotateX(68deg) rotateZ(360deg); }
        100% { transform: rotateX(68deg) rotateZ(0deg); }
      }
      @keyframes pulse-wave {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }
      @keyframes soundbar {
        0%, 100% { height: 4px; }
        50% { height: 18px; }
      }

      .orbital-ring-1 {
        animation: orbit-cw 10s linear infinite;
        transform-style: preserve-3d;
      }
      .orbital-ring-2 {
        animation: orbit-ccw 7s linear infinite;
        transform-style: preserve-3d;
      }
      .orbital-ring-3 {
        animation: orbit-cw 16s linear infinite;
        transform-style: preserve-3d;
      }
      .pulse-glow {
        animation: pulse-wave 4s ease-in-out infinite;
      }
      .bar-anim-1 { animation: soundbar 0.85s ease-in-out infinite; }
      .bar-anim-2 { animation: soundbar 1.1s ease-in-out 0.2s infinite; }
      .bar-anim-3 { animation: soundbar 0.7s ease-in-out 0.4s infinite; }
      .bar-anim-4 { animation: soundbar 1.05s ease-in-out 0.15s infinite; }

      /* Custom Range Sliders from Stitch */
      input[type=range] {
        -webkit-appearance: none;
        background: transparent;
        cursor: pointer;
      }
      input[type=range]:focus {
        outline: none;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 18px;
        width: 18px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 0 14px 2px rgba(168, 85, 247, 0.85), 0 2px 4px rgba(0,0,0,0.5);
        border: 2px solid #a855f7;
        margin-top: -5px;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      input[type=range]:active::-webkit-slider-thumb {
        transform: scale(1.2);
        box-shadow: 0 0 20px 4px rgba(0, 240, 255, 0.95);
        border-color: #00F0FF;
      }
      input[type=range]::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body class="bg-[#07050b] text-slate-100 min-h-screen selection:bg-purple-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
